# 复制为visdrone.local.yaml后填写当前机器的路径；不要修改原始标注。
path: /path/to/VisDrone2019-DET
train: VisDrone2019-DET-train/images
val: VisDrone2019-DET-val/images
train_annotations: VisDrone2019-DET-train/annotations
val_annotations: VisDrone2019-DET-val/annotations
# 可用train_labels/val_labels指定转换标签目录；Ultralytics要求其能由images路径推导。
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
